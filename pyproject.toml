# https://peps.python.org/pep-0517/
[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

# https://peps.python.org/pep-0621/
[project]
name = "napari-omero"
dynamic = ["version"]
description = "napari/OMERO interoperability"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Talley Lambert", email = "talley.lambert@gmail.com" },
    { name = "Will Moore", email = "w.moore@dundee.ac.uk" },
    { name = "Johannes Soltwedel", email = "johannes_richard.soltwedel@tu-dresden.de" },
    { name = "Peter Sobolewski", email = "peter.sobolewski@jax.org" },
]
keywords = ["OMERO.CLI", "plugin", "napari", "napari-plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Framework :: napari",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
# add your package dependencies here
dependencies = [
    "napari>=0.5.0",
    "omero-py",
    "omero-rois",
    "omero-marshal",
    # these come with napari ...
    # but are directly imported here as well so are included explicitly
    "qtpy>=1.10.0",
    "dask[array]>=2021.10.0",
    "superqt>=0.6.7",
]

# https://peps.python.org/pep-0621/#dependencies-optional-dependencies
# "extras" (e.g. for `pip install .[test]`)
[project.optional-dependencies]
all = ["napari[all]"]
test = [
    "pytest",
    "pytest-cov",
    "ezomero",
    "pytest-qt",
    "pytest-regressions",
    "pywin32; sys_platform == 'win32'",
]
# for pip (e.g. the README's conda + pip setup); keep the tools in sync with
# [dependency-groups] dev below, which uv uses
# TODO: remove in the future
dev = [
    "napari-omero[all, test]",
    "ipython",
    "mypy",
    "pdbpp",
    "prek",
    "rich",
    "ruff",
]

[project.urls]
homepage = "https://github.com/ome/napari-omero"
repository = "https://github.com/ome/napari-omero"
issues = "https://github.com/ome/napari-omero/issues"

# Entry points
# https://peps.python.org/pep-0621/#entry-points
# same as console_scripts entry point
[project.scripts]
napari-omero = "napari_omero.__main__:main"

[project.entry-points."napari.manifest"]
napari-omero = "napari_omero:napari.yaml"

# ---------------------------------------------------------------------------
# Development environments.
#
# `zeroc-ice` (needed by omero-py) is sdist-only on PyPI and hard to build, so:
#   - pixi gets omero-py + zeroc-ice from conda-forge (any supported Python);
#   - uv gets Glencoe Software's prebuilt wheels (Python 3.10-3.12 only).

# PEP 735 dependency groups (uv installs the "dev" group by default).
[dependency-groups]
dev = [
    # listed directly so that the [tool.uv.sources] entry below applies
    "zeroc-ice==3.6.5; python_version < '3.13'",
    "napari-omero[test]",
    "napari[pyqt6]", # same Qt as PyPI napari[all] installs, with napari's Qt version exclusions
    "ipython",
    "mypy",
    "pdbpp",
    "prek", # runs the hooks in .pre-commit-config.yaml
    "rich",
    "ruff",
]

[tool.uv]
# Only lock for what Glencoe publishes zeroc-ice wheels for (cp310-cp312 on the
# platforms below; see also .python-version). PySide6 is wheels-only too.
environments = [
    "python_version >= '3.10' and python_version < '3.13' and sys_platform == 'darwin'",
    "python_version >= '3.10' and python_version < '3.13' and sys_platform == 'win32' and platform_machine == 'AMD64'",
    "python_version >= '3.10' and python_version < '3.13' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "python_version >= '3.10' and python_version < '3.13' and sys_platform == 'linux' and platform_machine == 'aarch64'",
]
# precompile at install, to speed up napari start-up
compile-bytecode = true

[tool.uv.sources]
zeroc-ice = [
    { index = "zeroc-ice-macos", marker = "sys_platform == 'darwin'" },
    { index = "zeroc-ice-linux-x86_64", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "zeroc-ice-linux-aarch64", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "zeroc-ice-windows", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "zeroc-ice-macos"
url = "https://github.com/glencoesoftware/zeroc-ice-py-macos-universal2/releases/expanded_assets/20240131"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "zeroc-ice-linux-x86_64"
url = "https://github.com/glencoesoftware/zeroc-ice-py-linux-x86_64/releases/expanded_assets/20240202"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "zeroc-ice-linux-aarch64"
url = "https://github.com/glencoesoftware/zeroc-ice-py-linux-aarch64/releases/expanded_assets/20240620"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "zeroc-ice-windows"
url = "https://github.com/glencoesoftware/zeroc-ice-py-win-x86_64/releases/expanded_assets/20240325"
format = "flat"
explicit = true

# brings zeroc-ice 3.6.x from conda-forge
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.10"
omero-py = "*"
napari = "*"
omero-rois = "*"
omero-marshal = "*"
pyside6 = "*" # same Qt binding the README recommends for conda-forge
prek = "*" # runs the hooks in .pre-commit-config.yaml
ruff = "*"
mypy = "*"

[tool.pixi.pypi-dependencies]
napari-omero = { path = ".", editable = true }

# per-Python environments used by CI (uv covers 3.10-3.12)
[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314]
platforms = ["osx-arm64", "linux-64", "linux-aarch64", "win-64"] # no osx-64 zeroc-ice for 3.14
dependencies = { python = "3.14.*" }

[tool.pixi.environments]
default = ["test"]
py313 = ["py313", "test"]
py314 = ["py314", "test"]

[tool.pixi.tasks]
test = "pytest"

# https://docs.astral.sh/ruff
[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

# https://docs.astral.sh/ruff/rules
[tool.ruff.lint]
pydocstyle = { convention = "numpy" }
select = [
    "E",    # style errors
    "W",    # style warnings
    "F",    # flakes
    "D",    # pydocstyle
    "D417", # Missing argument descriptions in Docstrings
    "I",    # isort
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "B",    # flake8-bugbear
    "A001", # flake8-builtins
    "RUF",  # ruff-specific rules
    "TC",   # flake8-type-checking
    "TID",  # flake8-tidy-imports
]
ignore = [
    "D401", # First line should be in imperative mood
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D", "S"]

# https://docs.astral.sh/ruff/formatter/
[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = false # default is false

# https://mypy.readthedocs.io/en/stable/config_file.html
[tool.mypy]
files = ["src"]
strict = false
check_untyped_defs = true
ignore_missing_imports = true
disallow_any_generics = false
disallow_subclassing_any = false
show_error_codes = true
pretty = true


# https://docs.pytest.org/en/6.2.x/customize.html
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore:distutils Version classes are deprecated:",
    "ignore:the imp module is deprecated in:",
    "ignore:'U' mode is deprecated",
    "ignore:Please import PackageMetadata from 'npe2'",
    "ignore:`np.bool8` is a deprecated alias for `np.bool_`:DeprecationWarning:skimage",
    "ignore:Pickle, copy, and deepcopy support will be removed from itertools in Python 3.14:DeprecationWarning",
    # napari's EventedModel still uses pydantic's deprecated `json_encoders`
    # (napari/utils/events/evented_model.py); we can't fix it upstream from here.
    "ignore:`json_encoders` is deprecated:DeprecationWarning",
    # zeroc-ice's generated modules contain invalid escape sequences; Python
    # warns when compiling them on first import (a SyntaxWarning on 3.12+,
    # a DeprecationWarning before that, so no category is given)
    "ignore:.*invalid escape sequence",
    # omero-py's callbacks still call threading.Event.isSet() (e.g. when
    # deleteObjects(..., wait=True) waits); only ignored when raised from omero
    "ignore:isSet:DeprecationWarning:omero",
]


# https://coverage.readthedocs.io/en/6.4/config.html
[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
    "except ImportError",
    "\\.\\.\\.",
    "raise NotImplementedError()",
    "pass",
]
[tool.coverage.run]
source = ["src"]
